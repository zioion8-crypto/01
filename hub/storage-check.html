<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KTB Hub storage check (temporary)</title>
<style>body{font:14px/1.5 -apple-system,Segoe UI,sans-serif;padding:16px;background:#f6f8f7;color:#12211e}
pre{background:#fff;border:1px solid #dfe6e3;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-all}
.bad{color:#a4451a;font-weight:700}.ok{color:#15663f;font-weight:700}</style>
</head>
<body>
<h1>Storage check</h1>
<p>Reads this origin's localStorage and reports what the KTB Hub pages keep.</p>
<div id="out">…</div>
<script>
(function () {
  var rows = [], coord = /(-?\d{2,3}\.\d{3,})/g, hits = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i), v = localStorage.getItem(k);
    rows.push(k + ' = ' + v);
    var m = v.match(coord);
    if (m) hits.push(k + ': ' + m.join(', '));
  }
  var html = '<pre>' + (rows.length ? rows.join('\n').replace(/</g, '&lt;') : '(empty)') + '</pre>';
  html += '<p>Keys: <b>' + localStorage.length + '</b></p>';
  html += '<p>Coordinate-like values: ' + (hits.length
    ? '<span class="bad">FOUND — ' + hits.join(' | ') + '</span>'
    : '<span class="ok">none</span>') + '</p>';
  html += '<p>URL: ' + location.href + '<br>Has coordinate in URL: ' +
    (/[?&#=]\s*-?\d{2,3}\.\d{4,}/.test(location.href) ? '<span class="bad">yes</span>' : '<span class="ok">no</span>') + '</p>';
  document.getElementById('out').innerHTML = html;
})();
</script>
</body>
</html>
