<!DOCTYPE html>
<!-- /hub/ stays as a doorway for older links, other sites' articles and search results.
     The KTB Hub itself now opens at the site root (/). This page keeps the query string
     (?lang=ja, ?lang=zh, ?lang=cn …) and the fragment, then replaces the location. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>KTB Hub — koreatravelbible.com</title>
<link rel="canonical" href="https://koreatravelbible.com/">
<link rel="icon" href="../icons/ktb-favicon.png">
<script>
(function () {
  var q = location.search || '', h = location.hash || '';
  location.replace('/' + q + h);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/"></noscript>
<style>
:root{--brand:#0b5d4f;--line:#dfe6e3;--ink3:#5b6b67}
body{margin:0;background:#f6f8f7;color:#12211e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans","Malgun Gothic",sans-serif;line-height:1.55}
main{max-width:520px;margin:0 auto;padding:64px 20px;text-align:center}
h1{font-size:19px;margin:0 0 10px;color:var(--brand)}
p{font-size:14px;color:var(--ink3);margin:0 0 18px}
a.go{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;
  border-radius:999px;padding:12px 20px;font-size:15px}
a.small{display:inline-block;margin-top:16px;font-size:12.5px;color:var(--brand)}
</style>
</head>
<body>
<main>
  <h1>KTB Hub</h1>
  <p>The hub now opens at the top of the site.</p>
  <a class="go" href="/">Open KTB Hub →</a>
  <p><a class="small" href="/">koreatravelbible.com</a></p>
</main>
</body>
</html>
